name: Build AppImage

on:
  workflow_dispatch:
  # TEMP: 临时允许 push 到 master 触发，便于无 token 环境下由 AI 启动/重试构建。
  # 构建稳定通过后请移除此段，恢复为仅 workflow_dispatch。
  push:
    branches: [master]

permissions:
  # ci_report.py writes build.log / success.log to the ci-logs branch via the
  # Contents API; contents: write also covers artifact operations.
  contents: write
  # upload-artifact@v4 needs actions: write; declaring `permissions:` at the
  # workflow level otherwise strips every permission not listed here.
  actions: write

env:
  CARGO_TERM_COLOR: always
  # Prevent any apt post-install script from waiting on an interactive
  # debconf prompt (e.g. tzdata / locale), which is the usual cause of a
  # "stuck forever" apt-get install inside containers.
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-appimage:
    name: Build Linux AppImage (glibc 2.31)
    runs-on: ubuntu-22.04
    # GitHub no longer offers an ubuntu-20.04 hosted runner, so we pin the
    # Ubuntu 20.04 container instead. Ubuntu 20.04 ships glibc 2.31 and
    # WebKitGTK 4.0 (libwebkit2gtk-4.0), which is exactly what 中国麒麟 V10
    # (glibc 2.31, WebKitGTK 4.0) provides — building here yields a binary
    # that runs on the target without GLIBC / WebKit version mismatches.
    #
    # NOTE: Ubuntu 20.04 (focal) left standard support in 2025, so its packages
    # may have moved to old-releases.ubuntu.com. The apt steps below fall back
    # to old-releases automatically if archive.ubuntu.com fails.
    container:
      image: ubuntu:20.04
    timeout-minutes: 120

    steps:
      - name: Install base tools (root in container, no sudo)
        run: |
          set -e
          fix_sources() {
            sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
          }
          apt-get update \
            || { echo "::warning::apt update (archive) failed, falling back to old-releases"; fix_sources; apt-get update; }

          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config python3

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        timeout-minutes: 30
        run: |
          set -e
          fix_sources() {
            sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
          }
          apt-get update \
            || { echo "::warning::apt update (archive) failed, falling back to old-releases"; fix_sources; apt-get update; }
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Probe workspace writability
        if: always()
        run: |
          {
            echo "=== probe: $(date -u) ==="
            echo "SHELL=$SHELL  GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            pwd
            id
            echo "--- touch build.log in cwd ---"
            touch build.log 2>&1 && echo "TOUCH build.log OK" && ls -la build.log && rm -f build.log || echo "TOUCH build.log FAILED"
            echo "--- touch /tmp/ci.log ---"
            touch /tmp/ci.log 2>&1 && echo "/tmp OK" || echo "/tmp FAILED"
            echo "--- workspace dir perms ---"
            ls -ld "$(pwd)" "$(dirname "$(pwd)")" 2>&1
            echo "--- mounts ---"
            mount 2>/dev/null | grep -E "workspace|__w|overlay|/ " | head -4 || echo "(no mount info)"
            echo "--- df ---"
            df -h . 2>&1 | tail -1
            echo "--- cwd listing ---"
            ls -la 2>&1 | head -20
          } 2>&1 | tee /tmp/probe.log

      - name: Build AppImage
        run: |
          set -o pipefail
          # Log to /tmp (guaranteed writable in the container), then mirror to
          # build.log so the artifact and ci-logs channel always get the truth.
          {
            echo "=== build start: $(date -u) ==="
            echo "=== pwd: $(pwd) / id: $(id -un) ==="
            echo "=== tool versions ==="
            node --version 2>&1
            npm --version 2>&1
            cargo --version 2>&1
            rustc --version 2>&1
            echo "=== tauri cli ==="
            npx tauri --version 2>&1 || echo "tauri cli FAILED (exit $?)"
            echo "=== tauri build ==="
            npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles appimage 2>&1
            echo "=== tauri build exit=$? ==="
          } > /tmp/ci.log 2>&1
          ec=$?
          cp /tmp/ci.log build.log 2>/dev/null || echo "cp to build.log failed; full log in /tmp/ci.log"
          echo "=== /tmp/ci.log tail (last 80 lines) ==="
          tail -n 80 /tmp/ci.log
          echo "=== TAURI_BUILD_EXIT=$ec ==="
          exit $ec

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/ci.log
            /tmp/probe.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ok
        run: python3 .github/scripts/ci_report.py

      - name: Surface build error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: fail
        run: |
          python3 .github/scripts/ci_report.py || echo "::warning::ci_report.py failed"
          echo "=== build.log tail (also uploaded as artifact 'build-log') ==="
          tail -n 150 build.log 2>&1 || true
          exit 0

      - name: Upload AppImage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbx-desktop-appimage
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
