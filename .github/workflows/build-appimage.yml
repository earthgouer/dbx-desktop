name: Build AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Prevent any apt post-install script from waiting on an interactive
  # debconf prompt (e.g. tzdata / locale), which is the usual cause of a
  # "stuck forever" apt-get install inside containers.
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-appimage:
    name: Build Linux AppImage (glibc 2.31)
    runs-on: ubuntu-22.04
    # GitHub no longer offers an ubuntu-20.04 hosted runner, so we pin the
    # Ubuntu 20.04 container instead. Ubuntu 20.04 ships glibc 2.31 and
    # WebKitGTK 4.0 (libwebkit2gtk-4.0), which is exactly what 中国麒麟 V10
    # (glibc 2.31, WebKitGTK 4.0) provides — building here yields a binary
    # that runs on the target without GLIBC / WebKit version mismatches.
    container:
      image: ubuntu:20.04
    timeout-minutes: 90

    steps:
      - name: Install base tools (root in container, no sudo)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        timeout-minutes: 30
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dbx-desktop-appimage
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
