name: Build AppImage

on:
  workflow_dispatch:
  # TEMP: 本次重建（dangerousRemoteDomainIpcAccess 修复）用 push 自动触发，成功后移除。
  push:
    branches: [master]

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  # 防止 apt 的 post-install 脚本在容器内等交互输入（tzdata/locale 等）
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-appimage:
    name: Build Linux AppImage (glibc 2.31)
    runs-on: ubuntu-22.04
    # Ubuntu 20.04 提供 glibc 2.31 + WebKitGTK 4.0（libwebkit2gtk-4.0），
    # 与中国麒麟 V10 (glibc 2.31, WebKitGTK 4.0) 完全一致。
    # 注意：focal 已于 2025 年退出标准支持，apt 源可能已迁移到
    # old-releases.ubuntu.com，下面做了自动兜底。
    container:
      image: ubuntu:20.04
    timeout-minutes: 120

    steps:
      - name: Install base tools (root in container, no sudo)
        run: |
          set -e
          fix_sources() {
            sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
          }
          apt-get update \
            || { echo "::warning::apt update (archive) failed, falling back to old-releases"; fix_sources; apt-get update; }

          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config python3 \
            wget file libfuse2 desktop-file-utils

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        timeout-minutes: 30
        run: |
          set -e
          fix_sources() {
            sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
          }
          apt-get update \
            || { echo "::warning::apt update (archive) failed, falling back to old-releases"; fix_sources; apt-get update; }
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        env:
          # 降低并行 rustc 数，避免容器内高并发编译时的资源竞争
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
        run: |
          npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles appimage > build.log 2>&1
          ec=$?
          echo "=== build.log tail (last 60 lines) ==="
          tail -n 60 build.log
          echo "=== TAURI_BUILD_EXIT=$ec ==="
          exit $ec

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AppImage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbx-desktop-appimage
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
