name: Build AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appimage:
    name: Build Linux AppImage
    # ubuntu-20.04 is no longer a supported GitHub-hosted runner. Ubuntu 22.04
    # is the oldest maintained runner that provides Tauri 2's WebKitGTK 4.1
    # development package.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dbx-desktop-appimage
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
