name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-release
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04, ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "${VERSION}" > release-version.json
          cat release-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add macOS cross-compile targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Add Windows ARM cross-compile target
        if: runner.os == 'Windows'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --config release-version.json --bundles nsis

      - name: Build (Windows ARM)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --config release-version.json --target aarch64-pc-windows-msvc --bundles nsis

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --config release-version.json --bundles deb --bundles appimage

      - name: Build (macOS x86_64)
        if: runner.os == 'macOS'
        run: |
          set -e
          retry_build() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::macOS x86_64 build failed after 3 attempts"
                return 1
              fi
              echo "::warning::macOS x86_64 build failed (attempt $attempts), retrying in 30s"
              sleep 30
            done
          }
          retry_build npm run tauri build -- --config release-version.json --target x86_64-apple-darwin --bundles dmg

      - name: Build (macOS aarch64)
        if: runner.os == 'macOS'
        run: |
          set -e
          retry_build() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::macOS aarch64 build failed after 3 attempts"
                return 1
              fi
              echo "::warning::macOS aarch64 build failed (attempt $attempts), retrying in 30s"
              sleep 30
            done
          }
          retry_build npm run tauri build -- --config release-version.json --target aarch64-apple-darwin --bundles dmg

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/*
            src-tauri/target/x86_64-apple-darwin/release/bundle/*
            src-tauri/target/aarch64-apple-darwin/release/bundle/*
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/*
          if-no-files-found: error

  build-android:
    name: Build (Android arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "${VERSION}" > release-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Init and patch Android project
        run: |
          npm run tauri android init
          bash .github/scripts/patch-mobile.sh android

      - name: Build debug APK
        run: npm run tauri android build -- --config release-version.json --apk --debug --target aarch64

      - name: Stage APK
        run: |
          mkdir -p bundle-mobile
          APK="$(find src-tauri/gen/android/app/build/outputs/apk \
                    -type f -name '*debug*.apk' ! -name '*unaligned*' 2>/dev/null | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::no debug APK found under src-tauri/gen/android/app/build/outputs/apk"
            find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null | head -n 50
            exit 1
          fi
          echo "found APK: $APK"
          cp "$APK" "bundle-mobile/dsh-desktop-${VERSION}-android-arm64-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bundle-android
          path: bundle-mobile/*
          if-no-files-found: error

  build-ios:
    name: Build (iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "${VERSION}" > release-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install frontend dependencies
        run: npm install

      - name: Init and patch iOS project
        run: |
          npm run tauri ios init
          bash .github/scripts/patch-mobile.sh ios

      - name: Build simulator app
        run: npm run tauri ios build -- --config release-version.json --target aarch64-sim

      - name: Stage simulator zip
        run: |
          APP_PATH="$(find src-tauri/gen/apple/build -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::built .app not found under src-tauri/gen/apple/build"
            exit 1
          fi
          mkdir -p bundle-mobile
          cd "$(dirname "$APP_PATH")"
          zip -qry "$GITHUB_WORKSPACE/bundle-mobile/dsh-desktop-${VERSION}-ios-simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload simulator zip
        uses: actions/upload-artifact@v4
        with:
          name: bundle-ios-simulator
          path: bundle-mobile/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [build, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)" || {
              echo "::error::no tags found in repository, cannot determine release tag"
              exit 1
            }
          fi
          TITLE="DSH Desktop ${TAG}"
          echo "GITHUB_REF_TYPE=${GITHUB_REF_TYPE} GITHUB_REF_NAME=${GITHUB_REF_NAME} TAG=${TAG}"
          FILES="$(find bundles -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg' -o -name '*.apk' \))"
          if [ -z "$FILES" ]; then
            echo "::error::no installer files found in bundles"
            exit 1
          fi
          if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
            echo "::warning::release $TAG already exists; updating title and assets"
            gh release edit "$TAG" --title "$TITLE"
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" --generate-notes --title "$TITLE" $FILES
          fi

          INFO="$(gh release view "$TAG" --json name,tagName,isDraft,url)"
          echo "$INFO" | jq .
