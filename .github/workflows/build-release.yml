name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-release
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux builds run inside Ubuntu 20.04 so the produced binaries link
    # against glibc 2.31 / WebKitGTK 4.0, matching 中国麒麟 V10. GitHub no
    # longer provides a ubuntu-20.04 hosted runner, so we pin the container.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
            container: ubuntu:20.04
          - os: ubuntu-22.04-arm
            container: ubuntu:20.04

    steps:
      - name: Install base tools (container only)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "${VERSION}" > release-version.json
          cat release-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Add macOS cross-compile targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Add Windows ARM cross-compile target
        if: runner.os == 'Windows'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --config release-version.json --bundles nsis

      - name: Build (Windows ARM)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --config release-version.json --target aarch64-pc-windows-msvc --bundles nsis

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --config release-version.json --bundles deb --bundles appimage

      - name: Build (macOS x86_64)
        if: runner.os == 'macOS'
        run: |
          set -e
          retry_build() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::macOS x86_64 build failed after 3 attempts"
                return 1
              fi
              echo "::warning::macOS x86_64 build failed (attempt $attempts), retrying in 30s"
              sleep 30
            done
          }
          retry_build npm run tauri build -- --config release-version.json --target x86_64-apple-darwin --bundles dmg

      - name: Build (macOS aarch64)
        if: runner.os == 'macOS'
        run: |
          set -e
          retry_build() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::macOS aarch64 build failed after 3 attempts"
                return 1
              fi
              echo "::warning::macOS aarch64 build failed (attempt $attempts), retrying in 30s"
              sleep 30
            done
          }
          retry_build npm run tauri build -- --config release-version.json --target aarch64-apple-darwin --bundles dmg

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/*
            src-tauri/target/x86_64-apple-darwin/release/bundle/*
            src-tauri/target/aarch64-apple-darwin/release/bundle/*
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/*
          if-no-files-found: error

  build-android:
    name: Build (Android arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "${VERSION}" > release-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Init and patch Android project
        run: |
          npm run tauri android init
          bash .github/scripts/patch-mobile.sh android

      - name: Regenerate app icons from app-icon.png
        run: npm run tauri icon app-icon.png

      # Signing material comes entirely from repo secrets:
      #   ANDROID_KEYSTORE_BASE64  - keystore file encoded as base64
      #   ANDROID_KEYSTORE_PASSWORD - keystore/key password
      #   ANDROID_KEY_ALIAS        - key alias (defaults to dsh-desktop)
      - name: Restore release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set."
            echo "::error::Add it under Settings > Secrets and variables > Actions (base64 of the release keystore)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dsh-release.keystore"

      - name: Build release APK
        run: npm run tauri android build -- --config release-version.json --apk --target aarch64

      - name: Align, sign and stage APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::secret ANDROID_KEYSTORE_PASSWORD is not set."
            exit 1
          fi
          mkdir -p bundle-mobile
          APK="$(find src-tauri/gen/android/app/build/outputs/apk \
                    -type f -name '*release*.apk' ! -name '*unaligned*' 2>/dev/null | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::no release APK found under src-tauri/gen/android/app/build/outputs/apk"
            find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null | head -n 50
            exit 1
          fi
          echo "found APK: $APK"
          KS_PATH="$RUNNER_TEMP/dsh-release.keystore"
          KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-dsh-desktop}"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)"
          ALIGNED="$RUNNER_TEMP/app-aligned.apk"
          SIGNED="bundle-mobile/dsh-desktop-${VERSION}-android-arm64-release.apk"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS_PATH" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify "$SIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bundle-android
          path: bundle-mobile/*
          if-no-files-found: error

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "${VERSION}" > release-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install frontend dependencies
        run: npm install

      - name: Init and patch iOS project
        run: |
          npm run tauri ios init
          bash .github/scripts/patch-mobile.sh ios

      - name: Regenerate app icons from app-icon.png
        run: npm run tauri icon app-icon.png

      # --no-sign: archive without certificates and let the CLI wrap the .app
      # into an unsigned device IPA (installable via sideloading tools or by
      # signing with your own certificate).
      - name: Build unsigned device IPA
        run: npm run tauri ios build -- --config release-version.json --target aarch64 --no-sign

      - name: Stage IPA
        run: |
          mkdir -p bundle-mobile
          IPA="$(find src-tauri/gen/apple -type f -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::built .ipa not found under src-tauri/gen/apple"
            find src-tauri/gen/apple/build -type f 2>/dev/null | head -n 50
            exit 1
          fi
          echo "found IPA: $IPA"
          cp "$IPA" "bundle-mobile/dsh-desktop-${VERSION}-ios-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bundle-ios
          path: bundle-mobile/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [build, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES="$(find bundles -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg' -o -name '*.apk' -o -name '*.ipa' \))"
          if [ -z "$FILES" ]; then
            echo "::error::no installer files found in bundles"
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Official release bound to the pushed git tag.
            TAG="${GITHUB_REF_NAME}"
            TITLE="DSH Desktop ${TAG}"
            echo "publishing official release for ${TAG}"
            if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
              echo "::warning::release $TAG already exists; updating title and assets"
              gh release edit "$TAG" --title "$TITLE"
              gh release upload "$TAG" $FILES --clobber
            else
              gh release create "$TAG" --generate-notes --title "$TITLE" $FILES
            fi
          else
            # Manual run: a standalone rolling draft, fully detached from every
            # git tag and official release. The pseudo ref below is only ever
            # materialized if someone explicitly publishes this draft, so
            # existing tags/releases are never touched or overwritten.
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            TAG="manual-build"
            TITLE="DSH Desktop ${LATEST_TAG:-untagged} Manual Build #${GITHUB_RUN_NUMBER}"
            echo "updating standalone draft ${TAG}"
            if gh release view "$TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
              IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
              if [[ "$IS_DRAFT" != "true" ]]; then
                echo "::error::release '${TAG}' exists and is published; refusing to replace it"
                exit 1
              fi
              echo "::warning::replacing previous manual-build draft"
              gh release delete "$TAG" --yes
            fi
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Standalone manual workflow_dispatch build. Independent from all release tags." \
              $FILES
          fi

          INFO="$(gh release view "$TAG" --json name,tagName,isDraft,url)"
          echo "$INFO" | jq .
