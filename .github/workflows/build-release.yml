name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-release
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04, ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add macOS cross-compile targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Add Windows ARM cross-compile target
        if: runner.os == 'Windows'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis

      - name: Build (Windows ARM)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb --bundles appimage

      - name: Build (macOS x86_64)
        if: runner.os == 'macOS'
        run: |
          set -e
          retry_build() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::macOS x86_64 build failed after 3 attempts"
                return 1
              fi
              echo "::warning::macOS x86_64 build failed (attempt $attempts), retrying in 30s"
              sleep 30
            done
          }
          retry_build npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Build (macOS aarch64)
        if: runner.os == 'macOS'
        run: |
          set -e
          retry_build() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::macOS aarch64 build failed after 3 attempts"
                return 1
              fi
              echo "::warning::macOS aarch64 build failed (attempt $attempts), retrying in 30s"
              sleep 30
            done
          }
          retry_build npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/*
            src-tauri/target/x86_64-apple-darwin/release/bundle/*
            src-tauri/target/aarch64-apple-darwin/release/bundle/*
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            DRAFT_FLAG=""
            TITLE="DSH Desktop ${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}-build.${RUN_NUMBER}"
            DRAFT_FLAG="--draft"
            TITLE="DSH Desktop Draft"
          fi
          echo "GITHUB_REF_TYPE=${GITHUB_REF_TYPE} GITHUB_REF_NAME=${GITHUB_REF_NAME} TAG=${TAG}"
          FILES="$(find bundles -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg' \))"
          if [ -z "$FILES" ]; then
            echo "::error::no installer files found in bundles"
            exit 1
          fi
          gh release create "$TAG" $DRAFT_FLAG --generate-notes --title "$TITLE" $FILES

          INFO="$(gh release view "$TAG" --json name,tagName,isDraft,url)"
          echo "$INFO" | jq .
          if [[ "$(jq -r .isDraft <<<"$INFO")" == "true" && -z "$DRAFT_FLAG" ]]; then
            echo "::warning::release $TAG was created as a draft, publishing it"
            gh release edit "$TAG" --draft=false
          fi
