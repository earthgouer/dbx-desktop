<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBX Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="card">
        <div class="logo" aria-hidden="true">&gt;_</div>
        <p class="eyebrow">LOCAL COMMAND RUNNER</p>
        <h1 id="title">DBX Desktop</h1>
        <p class="subtitle">本机服务 · 端口 4224</p>

        <!-- 桌面端：自动检测 / 启动本机 dbx -->
        <section id="auto-flow">
          <p id="status" class="status">正在检测 dbx 服务…</p>
          <div id="spinner" class="spinner" aria-label="loading"></div>
          <p id="url" class="url" hidden></p>
        </section>

        <!-- 移动端：手动输入远端 dbx 地址 -->
        <section id="remote-flow" hidden>
          <form id="connect-form" autocomplete="off">
            <label class="field">
              <span>电脑 IP 地址</span>
              <input id="host-input" name="host" type="text" inputmode="url"
                     placeholder="例如 192.168.1.100" required />
            </label>
            <label class="field field-port">
              <span>端口</span>
              <input id="port-input" name="port" type="number" inputmode="numeric"
                     min="1" max="65535" value="4224" required />
            </label>
            <button id="connect-btn" type="submit" class="btn primary">连接</button>
          </form>
          <p id="remote-status" class="status" hidden></p>
          <div id="remote-spinner" class="spinner" aria-label="loading" hidden></div>
        </section>

        <div id="error" class="error" hidden>
          <p id="error-text"></p>
          <button id="retry" class="btn">重试</button>
        </div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
